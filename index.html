<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conway's Game of Life Virtual Museum</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="hud">
      <div id="roomLabel">Room 000 — Main Hall</div>
      <div id="controls">WASD move · Mouse look · E focus exhibit · R reset exhibit · Space pause/play · ↑↓ speed</div>

      <h2 id="overlayTitle"></h2>
      <p id="overlayDesc"></p>
      <p>Press <strong>E</strong> to close focus mode.</p>
    </div>
    <canvas id="app"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
